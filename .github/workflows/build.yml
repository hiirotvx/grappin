name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler le plugin
        run: mvn -B -ntp clean package

      - name: Publier le JAR
        uses: actions/upload-artifact@v4
        with:
          name: Grappin
          path: target/Grappin-*.jar
          if-no-files-found: error

      - name: Publier le JAR en release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Dernier build
          files: target/Grappin-*.jar
