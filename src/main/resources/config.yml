# Grappin : clic droit en visant un bloc pour etre projete vers lui.
# Aucun bouchon n'est lance. Si aucun bloc n'est a portee, rien n'est consomme.

grappin:
  # Distance maximale, en blocs, a laquelle on peut s'accrocher.
  range: 30
  # Temps de recharge entre deux utilisations reussies, en secondes, pour chaque niveau.
  # Chaque grappin porte son niveau, choisi au give / set : court, moyen ou long.
  # Modifiable a tout moment : /grappin reload s'applique aussitot a tous les grappins.
  cooldowns:
    court: 1
    moyen: 2
    long: 4
  # Multiplicateur de puissance de la projection.
  strength: 1.0
  # Apres un grappin, la premiere chute survenant dans ce delai (secondes) est annulee.
  fall-protection-seconds: 5
  # Points de durabilite retires a la canne a chaque grappin reussi.
  # Solidite reduit cette usure et Raccommodage la repare, comme pour tout outil.
  durability-cost: 1
  # Durabilite maximale, en points, pour chaque niveau : normale, bonne ou excellente.
  # Avec un cout de 1, c'est aussi le nombre d'utilisations. Une canne vanilla a 64 points.
  # Fixee sur l'objet a sa creation : un changement ici ne touche que les grappins
  # crees ensuite, ou mis a jour avec /grappin set.
  durabilities:
    normale: 64
    bonne: 128
    excellente: 256

item:
  # Le grappin est reconnu par un marqueur invisible, pas par son nom :
  # on peut donc le renommer a l'enclume sans le casser, et utiliser des degrades ici.
  name: "<!italic><gradient:#8c6239:#d9a441><b>Grappin</b></gradient>"
  lore:
    - "<!italic> "
    - "<!italic><#8a8175><i>Là où la corde porte, le guerrier suit.</i>"
    - "<!italic><gradient:#3b2f22:#8c6239:#3b2f22>━━━━━━━━━━━━━━━━</gradient>"
    - "<!italic><#d9a441>❯ <#a89f91>Clic droit <#6b6355>en visant un bloc"
    - "<!italic><#d9a441>❯ <#a89f91>Accroupi <#6b6355>pour viser une porte ou un coffre"
    - "<!italic><gradient:#3b2f22:#8c6239:#3b2f22>━━━━━━━━━━━━━━━━</gradient>"
  # Ajoutee sous la description, seulement pour les grappins qui s'usent (pas les illimites).
  wear-line: "<!italic><#6b6355>Chaque grappin réussi use la canne."

  # Chaque grappin porte ses propres options, fixees a sa creation. Elles se combinent
  # dans n'importe quel ordre :
  #   /grappin give Steve irreparable bonne court
  #   /grappin give illimite long
  #   /grappin set reparable excellente    (les options non precisees sont conservees)
  #
  # Les valeurs ci-dessous ne servent que par defaut : pour un give ou un set sans
  # l'option, et pour les anciens grappins crees avant l'existence de ce choix.
  # Chaque "-line" est ajoutee a la description de l'objet. Vide = aucune ligne.
  # Les grappins existants recoivent les nouvelles lignes avec /grappin set.

  # Durabilite : normale | bonne | excellente (valeurs dans grappin.durabilities).
  durability: normale
  durability-lines:
    normale: "<!italic><#d9a441>✦ <#a89f91>Durabilité normale"
    bonne: "<!italic><#d9a441>✦ <#a89f91>Bonne durabilité"
    excellente: "<!italic><#d9a441>✦ <#a89f91>Excellente durabilité"

  # Recharge : court | moyen | long (durees dans grappin.cooldowns).
  cooldown: moyen
  cooldown-lines:
    court: "<!italic><#d9a441>✦ <#a89f91>Recharge courte"
    moyen: "<!italic><#d9a441>✦ <#a89f91>Recharge moyenne"
    long: "<!italic><#d9a441>✦ <#a89f91>Recharge longue"

  # reparable | irreparable. Un grappin irreparable ne peut etre repare par aucun moyen :
  # Raccommodage, enclume, meule, etabli, ni commande /repair d'un autre plugin.
  # Sa durabilite ne peut que baisser.
  repairable: false
  unrepairable-line: "<!italic><#b5563f>✦ <#a89f91>Irréparable"

  # illimite | limite. Un grappin illimite ne perd aucune durabilite en s'accrochant ;
  # son niveau de durabilite n'est alors pas affiche.
  unlimited: false
  unlimited-line: "<!italic><#d9a441>✦ <#a89f91>Lancers illimités"

  # false = les joueurs ne peuvent pas enchanter un grappin : table d'enchantement
  # bloquee, et a l'enclume seul le renommage reste possible (pas de livre enchante).
  # Empeche notamment Solidite d'allonger la durabilite choisie.
  enchantable: false

messages:
  prefix: "<gradient:#8c6239:#d9a441><b>Grappin</b></gradient> <#5a4a38>┃ "
  cooldown: "<#b5563f>Grappin en recharge <#6b6355>· <#e8d5b0><time> s"
  nothing-to-grab: "<#b5563f>Rien à agripper <#6b6355>· portée <#e8d5b0><range> blocs"
  uses-left: "<#a89f91>Grappin <#6b6355>· <#e8d5b0><uses> <#a89f91>utilisations restantes"
  no-permission: "<#b5563f>Vous n'avez pas la permission."
  usage: "<#a89f91>Usage : <#d9a441>/grappin give [joueur] [options] <#6b6355>· <#d9a441>/grappin set [options] <#6b6355>· <#d9a441>/grappin reload <#6b6355>· options : <#a89f91>reparable|irreparable illimite|limite normale|bonne|excellente court|moyen|long"
  player-only: "<#b5563f>Cette commande est réservée aux joueurs."
  player-not-found: "<#b5563f>Joueur introuvable : <#e8d5b0><player>"
  given: "<#8fb26a>Grappin <state> <#8fb26a>donné à <#e8d5b0><player><#a89f91>."
  received: "<#8fb26a>Vous avez reçu un grappin <state><#8fb26a>."
  not-a-rod: "<#b5563f>Tenez une canne à pêche en main principale."
  converted: "<#8fb26a>Votre canne est désormais un grappin <state><#8fb26a>. <#6b6355>Ses enchantements sont conservés."
  updated: "<#8fb26a>Grappin mis à jour <#6b6355>· <state><#6b6355>. Son usure et ses enchantements sont conservés."
  # Composent <state> dans les messages ci-dessus, separes par state-separator.
  state-repairable: "<#8fb26a>réparable"
  state-unrepairable: "<#b5563f>irréparable"
  state-unlimited: "<#d9a441>illimité"
  state-durability-normale: "<#a89f91>durabilité normale"
  state-durability-bonne: "<#d9a441>bonne durabilité"
  state-durability-excellente: "<#d9a441>excellente durabilité"
  state-cooldown-court: "<#d9a441>recharge courte"
  state-cooldown-moyen: "<#a89f91>recharge moyenne"
  state-cooldown-long: "<#a89f91>recharge longue"
  state-separator: "<#6b6355>, "
  reloaded: "<#8fb26a>Configuration rechargée."
  repair-blocked: "<#b5563f>Grappin irréparable <#6b6355>· la réparation a été annulée"
  enchant-blocked: "<#b5563f>Un grappin ne peut pas être enchanté"
