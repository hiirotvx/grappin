# Grappin : clic droit en visant un bloc pour etre projete vers lui.
# Aucun bouchon n'est lance. Si aucun bloc n'est a portee, rien n'est consomme.

grappin:
  # Distance maximale, en blocs, a laquelle on peut s'accrocher.
  range: 30
  # Temps de recharge entre deux utilisations reussies, en secondes.
  cooldown: 2
  # Multiplicateur de puissance de la projection.
  strength: 1.0
  # Apres un grappin, la premiere chute survenant dans ce delai (secondes) est annulee.
  fall-protection-seconds: 5
  # Points de durabilite retires a la canne a chaque grappin reussi.
  # Solidite reduit cette usure et Raccommodage la repare, comme pour tout outil.
  # Une canne vanilla a 64 points : avec un cout de 1, cela fait 64 utilisations.
  durability-cost: 1

item:
  # Le grappin est reconnu par un marqueur invisible, pas par son nom :
  # on peut donc le renommer a l'enclume sans le casser, et utiliser des degrades ici.
  name: "<!italic><gradient:#8c6239:#d9a441><b>Grappin</b></gradient>"
  lore:
    - "<!italic> "
    - "<!italic><#8a8175><i>Là où la corde porte, le guerrier suit.</i>"
    - "<!italic><gradient:#3b2f22:#8c6239:#3b2f22>━━━━━━━━━━━━━━━━</gradient>"
    - "<!italic><#d9a441>❯ <#a89f91>Clic droit <#6b6355>en visant un bloc"
    - "<!italic><#d9a441>❯ <#a89f91>Accroupi <#6b6355>pour viser une porte ou un coffre"
    - "<!italic><gradient:#3b2f22:#8c6239:#3b2f22>━━━━━━━━━━━━━━━━</gradient>"
    - "<!italic><#6b6355>Chaque grappin réussi use la canne."
  # Durabilite maximale des grappins crees. 0 = durabilite vanilla d'une canne (64).
  # Ne s'applique qu'aux grappins crees ou mis a jour ensuite avec /grappin set.
  max-durability: 0
  # false : le grappin ne peut pas etre repare, par aucun moyen - Raccommodage, enclume,
  # meule, etabli, ni commande /repair d'un autre plugin. Sa durabilite ne peut que baisser.
  # true : il se repare comme n'importe quelle canne.
  repairable: false
  # Ligne ajoutee a la description quand le grappin est irreparable. Vide = aucune ligne.
  # Les grappins existants la recoivent avec /grappin set.
  unrepairable-line: "<!italic><#b5563f>✦ <#a89f91>Irréparable"

messages:
  prefix: "<gradient:#8c6239:#d9a441><b>Grappin</b></gradient> <#5a4a38>┃ "
  cooldown: "<#b5563f>Grappin en recharge <#6b6355>· <#e8d5b0><time> s"
  nothing-to-grab: "<#b5563f>Rien à agripper <#6b6355>· portée <#e8d5b0><range> blocs"
  uses-left: "<#a89f91>Grappin <#6b6355>· <#e8d5b0><uses> <#a89f91>utilisations restantes"
  no-permission: "<#b5563f>Vous n'avez pas la permission."
  usage: "<#a89f91>Usage : <#d9a441>/grappin give [joueur] <#6b6355>· <#d9a441>/grappin set <#6b6355>· <#d9a441>/grappin reload"
  player-only: "<#b5563f>Cette commande est réservée aux joueurs."
  player-not-found: "<#b5563f>Joueur introuvable : <#e8d5b0><player>"
  given: "<#8fb26a>Grappin donné à <#e8d5b0><player><#a89f91>."
  received: "<#8fb26a>Vous avez reçu un grappin."
  not-a-rod: "<#b5563f>Tenez une canne à pêche en main principale."
  converted: "<#8fb26a>Votre canne est désormais un grappin. <#6b6355>Ses enchantements sont conservés."
  updated: "<#8fb26a>Grappin mis à jour. <#6b6355>Son usure et ses enchantements sont conservés."
  reloaded: "<#8fb26a>Configuration rechargée."
  repair-blocked: "<#b5563f>Grappin irréparable <#6b6355>· la réparation a été annulée"
